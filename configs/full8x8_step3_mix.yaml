# Step 3, group B: the control recipe with a fifth of the training examples
# coming from games against Greedy and Minimax-d4 (research/step3-design.md).
#
# Everything the network does is unchanged from configs/full8x8.yaml: the same
# search budget, exploration noise and temperature, the same trainer, the same
# replay window. What changes is who sits on the other side of some games.
#
# The numbers:
#   480 self-play games          every move on both sides is a training example
#   240 games against opponents  only the network's moves are examples, about half
#   ------------------------------------------------------------------------
#   about as many training examples per generation as the control's 600
#   self-play games, so the groups are matched on data and on gradient steps
#   (800 of 1,024 positions), and differ in where a fifth of the data came from.
#
# Opponents take turns, so of the 240 external games 120 are against Greedy and
# 120 against Minimax-d4, and the network plays each as black 60 times and as
# white 60 times. Which games are external is fixed by their index, so a worker
# re-run or a resume plays the same mix.
#
# Group A, the control, is configs/full8x8.yaml itself continued from the same
# checkpoint; the two configs differ only in the `selfplay` block below.

name: full8x8-step3-mix

net:
  n_blocks: 6
  channels: 64

mcts:
  n_simulations: 200
  temp_moves: 15

selfplay:
  games_per_generation: 480   # self-play games; 600 in the control
  opponents: [greedy, minimax-d4]
  opponent_games: 240         # on top of the 480
  n_workers: 6
  games_in_flight: 24
  max_generations: 400

replay:
  window: 400000
  retain_shards: 30

train:
  steps_per_generation: 800
  batch_size: 1024
  optimizer: sgd
  lr: 0.02
  momentum: 0.9
  weight_decay: 0.0001

arena:
  every_n_generations: 5
  games: 400
