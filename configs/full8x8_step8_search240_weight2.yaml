# Step 8, group B-both-sp-240-w2: the Step 6 240-game recipe with the rows
# recorded at the opponent's positions counted 2 times in the policy loss
# (research/step8-design.md).
#
# Two keys differ from configs/full8x8_step5_search.yaml, the same two as in
# configs/full8x8_step6_search240.yaml (`opponent_games` up to 240 and
# `games_per_generation` down to 360, so the group still trains on about 600
# games' worth of rows), and one more, `train.opponent_policy_weight`, as in
# configs/full8x8_step7_weight2.yaml. Step 6 raised the signal at the
# opponent's positions by playing more external games; Step 7 raised it by
# weighting the rows and reached the same readings with the games fixed. Both
# routes stopped at the same place on the held-out row after their second
# doubling. This config applies both at once: about twice the distinct fatal
# positions of Step 5, each counted twice, with the network's own play still
# three fifths of its data, the share at which Step 6 found no cost.
#
# Everything else is the Step 5 recipe, continued from the same checkpoint.

name: full8x8-step8-search240-weight2

net:
  n_blocks: 6
  channels: 64

mcts:
  n_simulations: 200
  temp_moves: 15

selfplay:
  games_per_generation: 360   # self-play games; 480 in Step 5, 600 in the control
  opponents: [greedy, minimax-d4]
  opponent_games: 240         # the Step 6 dose; 120 in Step 5
  record_opponent_positions: true
  search_opponent_positions: true
  n_workers: 6
  games_in_flight: 24
  max_generations: 400

replay:
  window: 400000
  retain_shards: 30

train:
  opponent_policy_weight: 2   # the Step 7 weight; see the header
  steps_per_generation: 800
  batch_size: 1024
  optimizer: sgd
  lr: 0.02
  momentum: 0.9
  weight_decay: 0.0001

arena:
  every_n_generations: 5
  games: 400
