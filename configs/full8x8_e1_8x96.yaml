# Experiment E1, fallback size: 8 residual blocks of 96 channels.
#
# About 1.34 M parameters and roughly 3x the arithmetic per position of run 1's
# 6x64 network. This profile exists in case the bench shows that 10x128 pushes a
# generation past twenty minutes on the cluster. Twenty minutes is the ceiling
# because the wall-clock signal arrives fifteen minutes before the limit and the
# run must finish its current generation inside that window.
#
# Everything else matches `full8x8_e1_10x128.yaml`; see that file for the
# reasoning and the pre-registered prediction, which applies here unchanged.

name: full8x8-e1-8x96

net:
  n_blocks: 8                 # THE CHANGE. Run 1 used 6.
  channels: 96                # THE CHANGE. Run 1 used 64.

mcts:
  n_simulations: 200
  temp_moves: 15

selfplay:
  games_per_generation: 600
  n_workers: 6                # overridden per job by slurm/train.sbatch
  games_in_flight: 24
  max_generations: 400

replay:
  window: 400000
  retain_shards: 30

train:
  steps_per_generation: 800
  batch_size: 1024
  optimizer: sgd
  lr: 0.02
  momentum: 0.9
  weight_decay: 0.0001

arena:
  every_n_generations: 5
  games: 400
