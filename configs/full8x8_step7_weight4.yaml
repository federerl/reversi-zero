# Step 7, group B-both-sp-w4: the Step 5 recipe with the rows recorded at the
# opponent's positions counted 4 times in the policy loss (research/step7-design.md).
#
# One key differs from configs/full8x8_step5_search.yaml,
# `train.opponent_policy_weight`. Step 6 raised the share of those rows by
# playing more external games and found the held-out row moves with the dose,
# but at the largest dose the network's own self-play had become a fifth of
# its data and its strength paid for it. This config leaves the games exactly
# as Step 5 played them, 480 self-play and 120 external per generation, and
# raises the rows' share of the policy loss alone, to between what the 240- and 480-game
# groups had. The value head, the shards and the searches are untouched, so the
# difference between this run and Step 5 is the policy head's attention at the
# opponent's positions and nothing else.
#
# Everything else is the Step 5 recipe, continued from the same checkpoint;
# the two files are kept side by side so the diff is the experiment.

name: full8x8-step7-weight4

net:
  n_blocks: 6
  channels: 64

mcts:
  n_simulations: 200
  temp_moves: 15

selfplay:
  games_per_generation: 480   # self-play games; 600 in the control
  opponents: [greedy, minimax-d4]
  opponent_games: 120         # on top of the 480; 240 in group B
  record_opponent_positions: true
  search_opponent_positions: true
  n_workers: 6
  games_in_flight: 24
  max_generations: 400

replay:
  window: 400000
  retain_shards: 30

train:
  opponent_policy_weight: 4   # the one change; see the header
  steps_per_generation: 800
  batch_size: 1024
  optimizer: sgd
  lr: 0.02
  momentum: 0.9
  weight_decay: 0.0001

arena:
  every_n_generations: 5
  games: 400
