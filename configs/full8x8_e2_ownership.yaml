# Experiment E2: does telling the network *where* the discs end up help it learn?
#
# Everything here is `full8x8.yaml`, the run 1 recipe, except two lines: the
# network grows an ownership head, and the loss gains a term for it.
#
# What the head does. For each of the 64 squares it predicts who owns it when
# the game ends: +1 the player to move, -1 the opponent, 0 empty. That is the
# value target broken into its parts -- the final margin that decides `z` is the
# sum of these 64 numbers -- so the network is asked for the same answer as
# before, plus where it comes from. Sixty-four training signals per position
# instead of one, aimed at the same shared trunk the policy uses.
#
# Why this and not a heavier value weight. Run 2 weighted the value term four
# times as much and the agent got weaker: the policy signal was starved. This
# leaves the policy and value terms exactly as run 1 had them and adds a third
# term of the same natural scale as the value term (mean squared error on numbers
# in [-1, 1], weight 1.0). Run 4 showed that a bigger network lowers the value
# loss but buys only 30 to 40 Elo, so the value head's ceiling is not capacity
# alone; this asks whether it is the target.
#
# The head is never used at play time. `forward` still returns a policy and a
# value, the export and the browser are unchanged, and every checkpoint of this
# run is a drop-in for one from run 3.
#
# The prediction, written before the run: at matched generations 60 and 120
# against run 3 (the control), E2 wins 1000-game head-to-head matches with
# intervals excluding 50%, and by more than run 4's 30 to 40 Elo; value loss
# below 0.60 by generation 30. If value loss falls but strength does not, the
# ownership head made a better predictor and not a better player.
#
# Self-play cost is unchanged (200 simulations, 600 games), so generation N here
# has seen as much play as generation N of runs 1, 3 and 4.

name: full8x8-e2-ownership

net:
  n_blocks: 6
  channels: 64
  ownership: true             # THE CHANGE (1 of 2). 65 extra parameters.

mcts:
  n_simulations: 200
  temp_moves: 15

selfplay:
  games_per_generation: 600
  n_workers: 6                # overridden per job by slurm/train.sbatch
  games_in_flight: 24
  max_generations: 400

replay:
  window: 400000
  retain_shards: 30

train:
  steps_per_generation: 800
  batch_size: 1024
  optimizer: sgd
  lr: 0.02
  momentum: 0.9
  weight_decay: 0.0001
  ownership_loss_weight: 1.0  # THE CHANGE (2 of 2). Same scale as the value term.

arena:
  every_n_generations: 5
  games: 400
