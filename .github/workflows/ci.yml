name: CI

# CPU-only. No CUDA is available on GitHub runners and none is required: every
# core module must be importable and testable without a GPU (see
# docs/architecture.md, "dependency rules"). The `gpu` pytest marker is excluded
# unconditionally here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let a stray CUDA probe or a downloaded wheel index change behaviour.
  UV_FROZEN: "0"
  PYTHONHASHSEED: "0"

jobs:
  quality:
    name: lint + types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # If this action version ever disappears, replace with:
      #   curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync (CPU torch)
        # --extra obs brings matplotlib, which scripts/make_plots.py imports.
        # pyright checks scripts/, so without it the type job fails on an
        # import the code legitimately needs.
        run: uv sync --extra cpu --extra dev --extra api --extra obs

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pyright
        run: uv run pyright

  web:
    name: web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync (for the fixture check)
        run: uv sync --extra cpu --extra dev --extra web

      # The TypeScript engine is checked against data generated by the frozen
      # Python engine. If someone changes the Python rules without regenerating
      # the fixtures, the browser quietly stops being cross-checked -- so
      # regenerate them here and fail on any difference.
      #
      # The network fixture is skipped: it needs a trained model, which is not
      # in the repository. The rules, encoding, search and game fixtures are the
      # ones that guard the port.
      - name: Fixtures still describe the engine
        run: |
          uv run reversi export-fixtures /tmp/fixtures
          for name in rules encoding search games; do
            if ! diff -q "/tmp/fixtures/$name.json" "web/src/engine/__fixtures__/$name.json"; then
              echo "::error::$name.json is out of date. Regenerate with:"
              echo "::error::  uv run reversi export-fixtures web/src/engine/__fixtures__"
              exit 1
            fi
          done
          echo "all fixtures match the engine"

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync
        run: uv sync --extra cpu --extra dev --extra web

      # The real weights are not in the repository, and these tests do not need
      # them: they check that a move can be made and a game reaches an end, not
      # that the agent is any good. An untrained network of the right shape is
      # enough, and it keeps the browser tests independent of any release.
      - name: Build a placeholder network
        run: uv run python scripts/make_placeholder_model.py web/public/models

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # Against the built site, not the dev server. The bundler moves the ONNX
      # runtime's files around, and "works in development, hangs at load in
      # production" is a failure only this catches.
      - name: Playwright
        working-directory: web
        run: npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          if-no-files-found: ignore

  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync (CPU torch)
        run: uv sync --extra cpu --extra dev --extra api --python ${{ matrix.python-version }}

      # Target: under 90 seconds. `slow` covers the 50k-playout differential
      # test, the resume integration test, and the 4x4 smoke train -- all of
      # which run in nightly.yml instead.
      - name: pytest (fast selection)
        run: >
          uv run pytest -m "not slow and not gpu"
          --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
