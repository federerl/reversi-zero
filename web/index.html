<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>reversi-zero</title>
    <meta
      name="description"
      content="Board-game agents that learned by playing themselves, with a measured rating on every opponent. Everything runs in your browser."
    />
    <script>
      // Apply a remembered theme before the first paint, so a visitor who chose
      // dark does not see a light flash on every load. See src/shared/theme.ts.
      try {
        var t = localStorage.getItem("rz:theme:v1");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='rgb(46,89,67)'/%3E%3Ccircle cx='11' cy='16' r='6.5' fill='rgb(22,25,26)'/%3E%3Ccircle cx='21' cy='16' r='6.5' fill='rgb(242,240,234)'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/hub/main.tsx"></script>
  </body>
</html>
