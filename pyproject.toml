[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reversi-zero"
version = "0.1.0"
description = "AlphaZero-style Reversi: self-play training, PUCT MCTS, calibrated difficulty, web play"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Lifei Liu" }]
requires-python = ">=3.11,<3.13"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core runtime dependencies. `torch` is deliberately NOT listed here -- it is
# pulled in via the mutually exclusive `cpu` / `cu124` extras below so that one
# lockfile can serve the laptop, CI, and the GPU cluster.
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "scipy>=1.11",           # Bradley-Terry MLE fit only
]

[project.optional-dependencies]
# --- torch variants (mutually exclusive; see [tool.uv].conflicts) -----------
cpu = ["torch>=2.4"]
cu124 = ["torch>=2.4"]

# --- observability ----------------------------------------------------------
obs = [
    "tensorboard>=2.16",
    "matplotlib>=3.8",       # scripts/make_plots.py only
    "nvidia-ml-py>=12.535",  # GPU utilisation sampling; import name: pynvml
]

# --- web backend ------------------------------------------------------------
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

# --- development ------------------------------------------------------------
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[project.scripts]
reversi = "reversi.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/reversi"]

# ===========================================================================
# uv: dependency resolution and torch index selection
#
#   uv sync --extra cpu     # laptop, CI, CPU-only smoke tests
#   uv sync --extra cu124   # GPU cluster
#
# NOTE: the CUDA index URL must match the cluster's driver/toolkit. If the
# cluster ships a different CUDA runtime, change the `pytorch-cu124` index URL
# (e.g. .../whl/cu126) and re-lock. This is the ONLY place that needs to change.
# ===========================================================================
[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu124" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
]

# ===========================================================================
# ruff
# ===========================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["web", "runs", "models"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "ARG",  # unused arguments
    "PTH",  # use pathlib
    "RUF",  # ruff-specific
    "ANN",  # missing annotations
    "T20",  # no print() in library code
]
ignore = [
    "ANN401",  # Any is sometimes the honest annotation (e.g. **kwargs passthrough)
    "B905",    # zip(strict=) -- noisy; enforced by review where it matters
]

[tool.ruff.lint.per-file-ignores]
# Tests may use asserts, skip annotations, and print for debugging output.
"tests/**"   = ["ANN", "ARG", "T20", "N802", "N806"]
"bench/**"   = ["ANN", "T20"]
"scripts/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["reversi"]

[tool.ruff.format]
docstring-code-format = true

# ===========================================================================
# pyright
#
# `standard` (not `strict`) on src/: strict forces low-value annotations on
# torch/numpy internals without catching bugs we care about.
# ===========================================================================
[tool.pyright]
include = ["src", "tests", "scripts", "bench"]
exclude = ["**/__pycache__", "web", "runs", "models"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportPrivateImportUsage = false

[[tool.pyright.executionEnvironments]]
root = "tests"
typeCheckingMode = "basic"

[[tool.pyright.executionEnvironments]]
root = "bench"
typeCheckingMode = "basic"

[[tool.pyright.executionEnvironments]]
root = "src"

# ===========================================================================
# pytest
# ===========================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
timeout = 300
markers = [
    "slow: long-running (excluded from PR CI; run nightly)",
    "gpu: requires CUDA (never run in CI)",
    "differential: cross-validates the fast engine against game/reference.py",
    "property: Hypothesis-driven invariant tests",
]
filterwarnings = ["error::DeprecationWarning:reversi.*"]

# ===========================================================================
# coverage
# ===========================================================================
[tool.coverage.run]
source = ["src/reversi"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "if __name__ == .__main__.:",
]
